[pytest]
testpaths = tests
pythonpath = .
; Umbral inicial anclado a lo que cubren los tests de hoy (98%, con
; margen), no al 100% -- sube a medida que se agreguen más tests, no al
; revés. El --cov solo escopea el *reporte de cobertura* a estos dos
; módulos (los scripts de sync siguen sin tests); testpaths=tests ya
; corre TODO lo que haya en tests/ -- incluye src/app.py y
; src/utils/helpers.py (tests/test_app_mode_switch.py,
; tests/test_ui_helper.py) aunque no cuenten para este umbral.
addopts = --cov=src.factories.url_factory --cov=src.core.rom_info --cov-report=term-missing --cov-fail-under=90
